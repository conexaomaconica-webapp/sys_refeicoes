<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1b2a" />
    <title>Sem conexão | MA Refeições</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #020617; color: #f8fafc; font-family: system-ui, sans-serif; }
      main { max-width: 440px; padding: 32px; border: 1px solid #334155; border-radius: 24px; background: #0f172a; text-align: center; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
      h1 { margin: 0; font-size: 24px; }
      p { color: #cbd5e1; line-height: 1.6; }
      button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 18px; background: #10b981; color: #022c22; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão com o sistema</h1>
      <p>Por segurança, saldo, QR, recargas e históricos não são mantidos no cache offline. Reconecte-se para consultar dados atualizados.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
