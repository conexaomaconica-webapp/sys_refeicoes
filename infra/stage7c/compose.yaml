services:
  postgres-stage7c:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stage7c_security
      POSTGRES_USER: stage7c_owner
      POSTGRES_PASSWORD: stage7c_local_only
    ports:
      - "127.0.0.1:55437:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage7c_owner -d stage7c_security"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - stage7c-isolated

networks:
  stage7c-isolated:
    internal: true
