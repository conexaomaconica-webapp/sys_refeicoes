name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://synthetic-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-ci-anon-key-not-a-credential
      SUPABASE_SERVICE_ROLE_KEY: synthetic-ci-service-role-not-a-credential
      CONSUMER_IDENTITY_HMAC_KEY: synthetic-ci-hmac-key-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Sistema MA Refeicoes CI
      NEXT_PUBLIC_DEFAULT_TENANT_SLUG: synthetic-ci
      DEFAULT_PAYMENT_PROVIDER: mock

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the quality gate
        run: pnpm run ci:check

# Deliberately absent: Vercel token, production environment, deploy or database commands.
